<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#041d15">
  <title>عرض اليوم الوطني | منتجع يوم العائلة</title>
  <meta name="description" content="اكتشف عروض اليوم الوطني من منتجع يوم العائلة، تعرّف على التفاصيل وأكمل حجزك مباشرة.">
  <link rel="canonical" href="https://mohammedaabakhsh.github.io/familyday/offer/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="منتجع يوم العائلة">
  <meta property="og:title" content="عروض اليوم الوطني | يوم العائلة">
  <meta property="og:description" content="عرضان مميزان للاحتفال باليوم الوطني. شاهد التفاصيل واحجز مباشرة.">
  <meta property="og:image" content="https://mohammedaabakhsh.github.io/familyday/imgs/img01.webp">
  <link rel="icon" type="image/png" href="../imgs/icon.png">
  <link rel="apple-touch-icon" href="../imgs/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* Campaign palette: replace these values when the next offer changes. */
    :root{
      --page-bg:#041d15;
      --surface:#0a2b20;
      --surface-raised:#10392a;
      --line:#2a5441;
      --text:#f5faf7;
      --muted:#b7ccbf;
      --accent:#a0d7b6;
      --action:#176b43;
      --action-hover:#1d7a4e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;background:var(--page-bg);color:var(--text);
      font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased;
    }
    a{-webkit-tap-highlight-color:transparent}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .page{
      width:min(100%,1040px);margin:0 auto;
      padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(6.5rem + env(safe-area-inset-bottom,0px));
    }
    .page-heading{display:flex;align-items:center;gap:12px;}
    .back{
      display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;
      border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);
      text-decoration:none;transition:background .15s,border-color .15s;
    }
    .back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    h1{margin:0;font-size:22px;line-height:1.4;font-weight:700;}
    .hero{text-align:center;padding:18px 0 24px;}
    .logo{display:block;width:112px;height:64px;object-fit:contain;margin:0 auto;}
    .occasion{margin:10px 0 4px;color:var(--accent);font-size:13px;font-weight:500;line-height:1.5;}
    .slogan{margin:0;color:var(--text);font-size:30px;line-height:1.35;font-weight:700;}
    .offers{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;}
    .offer-card{
      min-width:0;display:flex;flex-direction:column;padding:20px;
      border:1px solid var(--line);border-radius:16px;background:var(--surface);
    }
    .offer-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;}
    .offer-label{
      padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-raised);
      color:var(--accent);font-size:13px;line-height:1.4;font-weight:700;
    }
    .offer-dates{margin:0;color:var(--muted);font-size:13px;line-height:1.6;}
    .offer-title{margin:0;font-weight:700;}
    .offer-intro{display:block;font-size:18px;line-height:1.5;}
    .offer-value{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-top:6px;color:var(--text);}
    .amount{font-size:54px;line-height:1.15;font-weight:800;}
    .currency{font-size:17px;line-height:1.5;font-weight:700;}
    .offer-note{
      margin:18px 0 0;padding-top:15px;border-top:1px solid var(--line);
      color:var(--muted);font-size:14px;line-height:1.7;
    }
    .offer-note strong{color:var(--accent);font-weight:700;}
    .offer-terms{margin:16px 0 0;text-align:center;color:var(--muted);font-size:12px;line-height:1.6;}
    .booking-bar{
      position:fixed;z-index:20;inset-inline:0;bottom:0;display:flex;justify-content:center;
      padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));
      border-top:1px solid var(--line);background:var(--page-bg);
    }
    .booking-link{
      display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;max-width:520px;
      padding:12px 18px;border:1px solid #307b54;border-radius:12px;background:var(--action);
      color:#fff;text-decoration:none;text-align:center;font-size:16px;font-weight:700;line-height:1.5;
      transition:background .15s;
    }
    @media(min-width:760px){
      .page{padding:32px 24px 48px;}
      h1{font-size:28px;}
      .hero{padding:20px 0 30px;}
      .logo{width:128px;height:74px;}
      .occasion{margin-top:12px;font-size:14px;}
      .slogan{font-size:38px;}
      .offers{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;}
      .offer-card{padding:26px;border-radius:18px;}
      .offer-head{margin-bottom:22px;}
      .offer-intro{font-size:20px;}
      .amount{font-size:64px;}
      .offer-note{margin-top:auto;}
      .offer-title{margin-bottom:20px;}
      .booking-bar{position:static;padding:0;margin-top:26px;border:0;background:transparent;}
      .booking-link{max-width:420px;}
    }
    @media(max-width:360px){
      .page{padding-inline:16px;}
      .page-heading{gap:10px;}
      h1{font-size:21px;}
      .offer-card{padding:18px;}
      .offer-head{gap:8px;}
      .amount{font-size:50px;}
    }
    @media(hover:hover) and (pointer:fine){
      .back:hover{background:var(--surface-raised);border-color:var(--accent);}
      .booking-link:hover{background:var(--action-hover);}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
  </style>
</head>
<body>
  <main class="page">
    <!-- Update campaign name, slogan, offer copy, dates, and contact message together. -->
    <header class="page-heading">
      <a class="back" href="../#home=resort" aria-label="العودة إلى منتجع يوم العائلة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </a>
      <h1>عرض اليوم الوطني</h1>
    </header>

    <div class="hero">
      <img class="logo" src="../imgs/img01.webp" alt="منتجع يوم العائلة" width="112" height="64">
      <p class="occasion">اليوم الوطني السعودي 96</p>
      <p class="slogan">عزّنا بطبعنا</p>
    </div>

    <section class="offers" aria-label="عروض اليوم الوطني">
      <article class="offer-card" aria-labelledby="offer-first-title" data-start="2026-09-22" data-end="2026-09-25">
        <div class="offer-head">
          <span class="offer-label">عرضنا الأول</span>
          <p class="offer-dates"><bdi dir="ltr">22–25</bdi> سبتمبر 2026</p>
        </div>
        <h2 class="offer-title" id="offer-first-title">
          <span class="offer-intro">خصم على الحجز</span>
          <span class="offer-value"><bdi class="amount">196</bdi><span class="currency">ريال</span></span>
        </h2>
        <p class="offer-note">مع <strong>ضيافة اليوم الوطني</strong></p>
      </article>

      <article class="offer-card" aria-labelledby="offer-second-title" data-start="2026-09-26" data-end="2026-09-29">
        <div class="offer-head">
          <span class="offer-label">عرضنا الثاني</span>
          <p class="offer-dates"><bdi dir="ltr">26–29</bdi> سبتمبر 2026</p>
        </div>
        <h2 class="offer-title" id="offer-second-title">
          <span class="offer-intro">احجز يومًا والثاني بـ</span>
          <span class="offer-value"><bdi class="amount">96</bdi><span class="currency">ريال</span></span>
        </h2>
        <p class="offer-note">اليوم الثاني يكون بعد يوم الحجز مباشرة</p>
      </article>
    </section>
    <p class="offer-terms">تطبق الشروط والأحكام</p>

    <nav class="booking-bar" aria-label="الحجز والتواصل">
      <a class="booking-link" href="https://wa.me/966556156693?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D8%B9%D8%B1%D8%B6%20%D8%A7%D9%84%D9%8A%D9%88%D9%85%20%D8%A7%D9%84%D9%88%D8%B7%D9%86%D9%8A" target="_blank" rel="noopener noreferrer">احجز العرض عبر واتساب</a>
    </nav>
  </main>
</body>
</html>
