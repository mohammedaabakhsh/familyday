<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>معاينة يوم العائلة</title><style>*{box-sizing:border-box}body{margin:0;background:#dce5e9;font-family:system-ui,sans-serif;color:#183440}.bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}button,a{border:1px solid #a7bbc5;border-radius:8px;padding:9px 14px;background:white;color:inherit;text-decoration:none;font:inherit;cursor:pointer}button.active{background:#173e4b;color:white}main{display:flex;justify-content:center;padding:0 12px 24px}iframe{width:390px;height:844px;border:0;background:#071a26;border-radius:18px;box-shadow:0 8px 30px #001b3830;display:block;max-width:100%}body.desktop iframe{width:1360px;height:900px;border-radius:8px}</style></head><body><div class="bar"><button id="mobile" class="active" onclick="setMode(false)">الجوال</button><button id="compact" onclick="setCompact()">جوال صغير</button><button id="desktop" onclick="setMode(true)">الكمبيوتر</button><button type="button" onclick="document.getElementById('preview').src='app-preview.html?v=6.1#home=resort'">قبل الحجز</button><button type="button" onclick="document.getElementById('preview').src='app-preview.html?v=6.1&amp;demo=booking#bookings'">قبل الوصول</button><button type="button" onclick="document.getElementById('preview').src='app-preview.html?v=6.1&amp;demo=staying#bookings'">أثناء الإقامة</button><a href="app-preview.html?v=6.1#home=resort" target="_blank">فتح المعاينة</a><a href="index.html#home=resort" target="_blank">التصميم السابق</a></div><main><iframe id="preview" title="تطبيق يوم العائلة" src="app-preview.html?v=6.1#home=resort"></iframe></main><script>function setMode(d){document.body.classList.toggle('desktop',d);document.getElementById('preview').style.width=d?'1360px':'390px';document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById(d?'desktop':'mobile').classList.add('active')}function setCompact(){setMode(false);document.getElementById('preview').style.width='360px';document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('compact').classList.add('active')}</script></body></html>
