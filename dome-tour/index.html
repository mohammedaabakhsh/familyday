<div class="tour-page">

<script>
(function () {
  var params=new URLSearchParams(window.location.search);
  var from=params.get('from'), cabinId=params.get('cabin')==='12'?'12':'1';
  var back=document.querySelector('.tour-back');
  if(from==='map'){
    back.href='/resort-map/?v=map-return-20261028-v2#map='+cabinId;
    back.innerHTML='<span aria-hidden="true">→</span> خريطة الأكواخ';
  } else if(from==='guide'){
    back.href='/services-guide/#resort-map';
    back.innerHTML='<span aria-hidden="true">→</span> دليل المنتجع';
  } else if(from==='details'){
    back.href='/#cabin='+cabinId+(params.get('return')==='map'?'&from=map':'');
    back.innerHTML='<span aria-hidden="true">→</span> بيت الدوم';
  }
})();
</script>
