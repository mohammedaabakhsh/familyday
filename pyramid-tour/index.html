<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071a28">
<title>جولة داخل الكوخ الهرمي | يوم العائلة</title>
<meta name="description" content="استكشف الكوخ الهرمي ومرافقه في جولة تفاعلية من منتجع يوم العائلة.">
<link rel="canonical" href="https://familydaystay.com/pyramid-tour/">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dome-tour.css?v=3">
<style>
*{box-sizing:border-box}body{margin:0;background:#071a28;color:#f4f8fa;font-family:Tajawal,sans-serif;min-height:100vh}a{color:inherit}.tour-page{max-width:1120px;margin:auto;padding:0 18px 28px}.tour-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #234353;padding:14px 0}.tour-back{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:#b4e3eb;font-size:15px}.tour-brand{font-size:15px;color:#9db8c5}.tour-footer{display:flex;justify-content:center;margin:20px 0 0}.tour-detail-link{padding:12px 22px;border:1px solid #2b7183;border-radius:10px;text-decoration:none;color:#c6edf2;min-height:44px}.tour-back:focus-visible,.tour-detail-link:focus-visible{outline:3px solid #92efff;outline-offset:3px}#ov .dt-tour{margin:20px 0 0}noscript{display:block;margin:30px;text-align:center}@media(max-width:599px){.tour-page{padding:0 8px 20px}.tour-nav{margin:0 8px}.tour-brand{font-size:13px}#ov .dt-tour{margin-top:14px}}

/* Keep the illustration and its selected specifications together in the viewport. */
.tour-page{padding-bottom:10px}
.tour-nav{padding:3px 0}
#ov .dt-tour{margin-top:10px;padding-top:12px;padding-bottom:10px}
#ov .dt-title{font-size:26px;line-height:1.3;margin-bottom:6px}
#ov .dt-image{width:min(88%,max(300px,calc(150svh - 570px)))}
#ov .dt-label{font-size:15px;min-height:40px}
#ov .dt-label--tub,#ov .dt-label--bedroom{top:18%}
#ov .dt-label--pool,#ov .dt-label--outdoor{top:36%}
#ov .dt-languages{margin:-6px auto 8px}
#ov .dt-languages button{min-height:36px;padding:6px 10px}
#ov .dt-details{min-height:0;padding:9px;gap:10px}
#ov .dt-detail-heading{flex-basis:100px}
#ov .dt-detail-heading h4{font-size:18px}
#ov .dt-card{min-height:66px;padding:6px 4px;gap:3px}
#ov .dt-occupancy{font-size:13px;margin-top:7px}
@media(min-width:600px) and (max-width:899px){#ov .dt-details{display:flex}#ov .dt-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:599px){
 .tour-nav{padding:1px 0}
 #ov .dt-tour{margin-top:8px;padding-top:12px}
 #ov .dt-title{font-size:22px;margin-bottom:10px}
 #ov .dt-labels{gap:6px}
 #ov .dt-label{font-size:12px;min-height:40px;inset:auto}
 #ov .dt-image{width:min(88%,max(230px,calc(150svh - 750px)))}
 #ov .dt-languages{margin:-6px auto 8px}
 #ov .dt-details{padding:9px;margin-inline:8px}
 #ov .dt-detail-heading{margin-bottom:8px}
 #ov .dt-detail-heading h4{font-size:17px}
 #ov .dt-detail-heading p{font-size:12px}
 #ov .dt-card{min-height:65px}
 #ov .dt-card svg{width:18px;height:18px}
 #ov .dt-card strong{font-size:11px;line-height:1.4}
 #ov .dt-card strong[dir=ltr]{font-size:14px}
 #ov .dt-note{font-size:12px;margin-top:6px}
}

/* Open canvas; desktop follows the resort map's illustration/detail split. */
#ov .dt-tour{border:0;border-radius:0;background:transparent;overflow:visible}
#ov .dt-image{object-fit:contain;clip-path:none;border-radius:0}
@media(min-width:900px){
 #ov .dt-tour{display:grid;grid-template-columns:minmax(280px,32%) minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"heading heading" "details stage" "occupancy stage";gap:20px 24px;direction:ltr;padding-inline:0;min-height:min(640px,calc(100svh - 90px))}
 #ov .dt-title{grid-area:heading;text-align:right;padding-bottom:14px;margin:0;border-bottom:1px solid #234353;font-size:24px}
 #ov .dt-languages{grid-area:heading;align-self:start;justify-self:start;margin:0}
 #ov .dt-stage{grid-area:stage;align-self:center;min-width:0}
 #ov .dt-image{width:100%;height:auto}
 #ov .dt-details{grid-area:details;display:block;align-self:start;margin:0;padding:16px}
 #ov .dt-detail-heading{margin-bottom:16px}
 #ov .dt-detail-heading h4{font-size:22px}
 #ov .dt-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 #ov .dt-card{min-height:76px}
 #ov .dt-card strong{font-size:13px}
 #ov .dt-note{margin-top:12px}
 #ov .dt-occupancy{grid-area:occupancy;align-self:end;margin:0 0 10px}
 #ov .dt-tour[lang=ar] .dt-details{direction:rtl}
 #ov .dt-tour[lang=en] .dt-details{direction:ltr}
 #ov .dt-label{font-size:13px;min-height:40px;width:20%;padding:6px}
}

/* Place desktop labels in the clear space around the transparent illustration. */
@media(min-width:900px){
 #ov .dt-label--kitchen{left:19%;right:auto;top:0;bottom:auto}
 #ov .dt-label--bathroom{right:19%;left:auto;top:0;bottom:auto}
 #ov .dt-label--tub{left:0;right:auto;top:20%;bottom:auto}
 #ov .dt-label--bedroom{right:0;left:auto;top:20%;bottom:auto}
 #ov .dt-label--pool{left:12%;right:auto;top:auto;bottom:0}
 #ov .dt-label--outdoor{right:12%;left:auto;top:auto;bottom:0}
}

/* Seven facilities around the complete Pyramid illustration. */
@media(min-width:600px){
 #ov .dt-stage{padding:56px 0 54px}
 #ov .dt-image{width:94%}
 #ov .dt-label{width:26%;font-size:13px}
 #ov .dt-label--kitchen{left:0;right:auto;top:0;bottom:auto}
 #ov .dt-label--bathroom{left:37%;right:auto;top:0;bottom:auto}
 #ov .dt-label--bedroom{left:auto;right:0;top:0;bottom:auto}
 #ov .dt-label--living{left:0;right:auto;top:21%;bottom:auto}
 #ov .dt-label--tub{left:auto;right:0;top:21%;bottom:auto}
 #ov .dt-label--outdoor{left:12%;right:auto;top:auto;bottom:0}
 #ov .dt-label--pool{left:auto;right:12%;top:auto;bottom:0}
}
@media(max-width:599px){
 #ov .dt-labels .dt-label:last-child{grid-column:2}
 #ov .dt-image{width:96%;margin-top:8px}
 #ov .dt-languages{margin:4px auto 10px}
}

/* Keep pool and seating labels beside the illustration on desktop. */
@media(min-width:900px){
 #ov .dt-stage{padding:54px 0 0}
 #ov .dt-image{width:78%}
 #ov .dt-label--outdoor{left:0;right:auto;top:58%;bottom:auto;width:20%}
 #ov .dt-label--pool{left:auto;right:0;top:76%;bottom:auto;width:20%}
}
</style>
<link rel="stylesheet" href="/tour-layout.css?v=1">
</head>
<body>
<div class="tour-page">
<header class="tour-nav"><a class="tour-back" href="/#resort"><span aria-hidden="true">→</span> العودة إلى الأكواخ</a></header>
<main id="ov"><div id="pyramid-tour-host"></div><noscript>فعّل JavaScript لعرض الجولة التفاعلية.</noscript></main>

</div>
<script>
(function () {
 var from=new URLSearchParams(location.search).get('from'),back=document.querySelector('.tour-back');
 if(from==='map'){back.href='/#map=2';back.innerHTML='<span aria-hidden="true">→</span> خريطة الأكواخ';}
 else if(from==='details'){back.href='/#cabin=2';back.innerHTML='<span aria-hidden="true">→</span> الكوخ الهرمي';}
})();
</script>
<script src="/resort-data.js?v=11"></script>
<script src="/pyramid-tour.js?v=5"></script>
</body></html>
